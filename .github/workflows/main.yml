name: Build YTM Arabic locally mergeable tweak
on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build YTMEnhanced
    runs-on: macos-latest
    permissions:
      contents: read

    steps:
      - name: Checkout Main
        uses: actions/checkout@v6.0.2
        with:
          path: main
          submodules: recursive

      - name: Install Dependencies
        run: brew install make ldid pipx

      - name: Set PATH environment variables
        run: |
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          echo "THEOS=${{ github.workspace }}/theos" >> $GITHUB_ENV

      - name: Cache Theos
        id: theos
        uses: actions/cache@v5.0.3
        env:
          cache-name: theos_cache_344ee59
        with:
          path: theos/
          key: ${{ env.cache-name }}
          restore-keys: ${{ env.cache-name }}

      - name: Setup Theos
        if: steps.theos.outputs.cache-hit != 'true'
        uses: actions/checkout@v6.0.2
        with:
          repository: theos/theos
          ref: 344ee5925df036dbd1312b783ad5a00d153c2445
          path: theos
          submodules: recursive

      - name: Download iOS SDK
        if: steps.theos.outputs.cache-hit != 'true'
        run: |
          git clone --quiet -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git
          cd sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          mkdir -p "$THEOS/sdks"
          mv *.sdk $THEOS/sdks

      - name: Run lyrics and translation host tests
        run: |
          cd main
          sed "s/arm64-apple-ios16.0-macabi/$(uname -m)-apple-ios16.0-macabi/" Tests/Host/run.sh > Tests/Host/run-ci.sh
          XCODE="$(dirname "$(dirname "$(xcode-select -p)")")" bash Tests/Host/run-ci.sh

      - name: Build Arabic sideloading tweak
        run: |
          cd main
          make clean package SIDELOADING=1 FINALPACKAGE=1 DEBUG=0

      - name: Upload Arabic tweak
        uses: actions/upload-artifact@v7.0.1
        with:
          name: YTM-Arabic-Tweak
          path: main/packages/*.deb
          if-no-files-found: error
          retention-days: 1
